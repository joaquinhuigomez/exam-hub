/* ---------- opa-eef (4) ---------- */
{id:"rd01",cat:"opa-eef",type:"mc",stem:"Which of the following is an organizational process asset (OPA) rather than an enterprise environmental factor (EEF)?",
 options:["The lessons-learned repository maintained across past projects","The organization's reporting structure and hierarchy","Government regulations governing the product","Current market conditions in the target region"],
 key:"The lessons-learned repository maintained across past projects",
 why:"OPAs are what the organization has built and can change: plans, processes, procedures, templates and knowledge bases. EEFs are the conditions the project must work within, whether internal (structure, culture) or external (regulation, market)."},
{id:"rd02",cat:"opa-eef",type:"mc",stem:"Which of the following is an enterprise environmental factor (EEF) rather than an organizational process asset (OPA)?",
 options:["Organizational culture and management style","The organization's change control procedure","A standard risk category template","The corporate project archive"],
 key:"Organizational culture and management style",
 why:"Hook: assets are authored, factors are inherited. Culture, structure, regulation and market conditions are inherited; procedures, templates and archives were authored by the organization."},
{id:"rd03",cat:"opa-eef",type:"mc",stem:"An organization's code of ethics and its conduct policies are classified as:",
 options:["Organizational process assets, which are used to build the governance framework","Enterprise environmental factors, because they constrain behaviour","Standard operating procedures authored by the project team","Components of the project charter"],
 key:"Organizational process assets, which are used to build the governance framework",
 why:"Policies, including ethics codes, are OPAs, and a governance framework emphasising integrity, transparency and accountability is assembled from them. SOPs give execution consistency but do not define ethics; the charter authorises the project."},
{id:"rd05",cat:"opa-eef",type:"mc",stem:"How does an organizational knowledge repository differ from a lessons-learned register?",
 options:["The repository holds knowledge accumulated across the organization's past projects; the register holds lessons captured during the current project","The repository holds financial data; the register holds risk data","The repository is an EEF; the register is an OPA","The register replaces the repository once a project closes"],
 key:"The repository holds knowledge accumulated across the organization's past projects; the register holds lessons captured during the current project",
 why:"Hook: repository = organizational and cumulative, register = project-level and live. The repository is an OPA; the register is a project document whose contents transfer into the repository at closure, which is why the repository is the search target when a plan must reflect organizational experience."},

/* ---------- governance (4) ---------- */
{id:"rd06",cat:"governance",type:"mc",stem:"A project governance framework primarily defines:",
 options:["Roles, responsibilities, decision authority and escalation thresholds","The sequence of activities that produce the deliverables","The acceptance criteria for each deliverable","The estimating techniques used for cost and duration"],
 key:"Roles, responsibilities, decision authority and escalation thresholds",
 why:"Governance answers who decides what, within what limits, and when a matter must move upward. It is an authority structure, not a work plan or a quality standard."},
{id:"rd07",cat:"governance",type:"mc",stem:"An issue that exceeds the project manager's delegated authority is decided by:",
 options:["The steering committee or equivalent governance body","The project team at its next retrospective","The project management office's template library","The functional manager of whichever department raised it"],
 key:"The steering committee or equivalent governance body",
 why:"The steering committee is the standing decision authority above the project manager. Escalation runs to the body the governance framework names, not to whoever is nearest to the problem."},
{id:"rd08",cat:"governance",type:"mc",stem:"In governance terms, a tolerance (or threshold) is:",
 options:["The permitted deviation from the plan before escalation is required","The largest contingency reserve the project is allowed to hold","The confidence interval produced by a simulation","The defect rate the customer has agreed to accept"],
 key:"The permitted deviation from the plan before escalation is required",
 why:"Tolerances turn judgement into a rule: inside the band the project manager manages, outside it the matter is escalated as the plan prescribes."},
{id:"rd09",cat:"governance",type:"mc",stem:"Who authorizes the use of management reserve?",
 options:["Management, because the reserve sits outside the cost baseline and outside the PM's control","The project manager, who controls all project funds","The risk owner for the event that triggered the need","No one; it is drawn automatically when contingency runs out"],
 key:"Management, because the reserve sits outside the cost baseline and outside the PM's control",
 why:"Split the two reserves by owner: contingency reserve is inside the cost baseline and the project manager releases it for identified risks; management reserve is outside the baseline, held for unknown-unknowns, and released by management."},

/* ---------- money-rules (4) ---------- */
{id:"rd10",cat:"money-rules",type:"mc",stem:"Contingency reserve is available to fund:",
 options:["Identified risks that were analyzed and provisioned for this project","General cost overruns on any activity, whatever the cause","Unknown-unknown events outside the project's risk analysis","Scope added to the project after the baseline was approved"],
 key:"Identified risks that were analyzed and provisioned for this project",
 why:"Contingency covers known-unknowns and is ring-fenced to the risks it was sized for, so it is not a general overrun buffer and cannot be diverted to unrelated work. Unknown-unknowns are management reserve's job and new scope goes through change control."},
{id:"rd11",cat:"money-rules",type:"mc",stem:"Approved use of management reserve affects the cost baseline in that:",
 options:["The baseline is increased through an approved change request","The baseline is unchanged, because the reserve was always inside it","The baseline is reduced by the amount released","Only the funding requirement moves; the baseline is never touched"],
 key:"The baseline is increased through an approved change request",
 why:"Management reserve is inside the project budget but outside the cost baseline, so moving money into the baseline is a baseline change and needs a change request."},
{id:"rd12",cat:"money-rules",type:"mc",stem:"Per PMP exam convention, in procurement closure, formal verification of deliverables against the contract:",
 options:["Precedes final payment","Follows final payment, as a receipt check","Removes the need for a procurement audit","Happens only if the seller requests it"],
 key:"Precedes final payment",
 why:"Verify, then pay. Paying before contractual verification surrenders the buyer's leverage and bypasses the acceptance mechanism the contract already defines. Real contracts schedule progress payments on their own terms; the exam asks only about the final payment at closure."},
{id:"rd13",cat:"money-rules",type:"mc",stem:"A disputed invoice under an active contract is resolved through:",
 options:["The claims administration and dispute-resolution mechanism written into the contract","An informal joint inspection arranged between the parties","The project issue log's internal escalation path","Immediate arbitration, since the parties disagree"],
 key:"The claims administration and dispute-resolution mechanism written into the contract",
 why:"A contract is a legal instrument: its own claims clause governs, and negotiated settlement is attempted inside that mechanism before arbitration or litigation."},

/* ---------- tool-purpose (5) ---------- */
{id:"rd14",cat:"tool-purpose",type:"mc",stem:"Which technique converts actual performance data into a forecast of future schedule and cost outcomes?",
 options:["Trend analysis","A risk assessment workshop","A risk breakdown structure","Variance analysis"],
 key:"Trend analysis",
 why:"Trend analysis extends actuals forward, so it is the answer whenever the ask is how late or how far over budget the project will end up. Variance analysis measures the gap that has already opened; only trend analysis projects it forward, and a workshop forecasts nothing."},
{id:"rd15",cat:"tool-purpose",type:"mc",stem:"The purpose of a risk workshop is to:",
 options:["Identify and assess risks with the relevant participants","Forecast completion dates from performance data","Verify deliverables against contractual obligations","Measure work performed against the cost baseline"],
 key:"Identify and assess risks with the relevant participants",
 why:"Workshops surface and evaluate uncertainty; they produce no forecast of actual performance. Identify-and-assess and forecast are different jobs and different tools."},
{id:"rd16",cat:"tool-purpose",type:"mc",stem:"A risk breakdown structure (RBS) is:",
 options:["A hierarchical categorization of potential sources of risk","A prioritized ranking of risks by exposure","A diagnostic technique for finding why a problem occurred","A record of risk responses and their owners"],
 key:"A hierarchical categorization of potential sources of risk",
 why:"The RBS is the risk world's WBS: it sorts where risk comes from. Prioritization belongs to qualitative analysis in the risk register, diagnosis to root cause analysis, and response ownership to the register."},
{id:"rd17",cat:"tool-purpose",type:"mc",stem:"Which technique establishes WHY a shared statement, such as a project vision, is being interpreted differently by different groups?",
 options:["Root cause analysis","A risk breakdown structure","Earned value analysis","Monte Carlo simulation"],
 key:"Root cause analysis",
 why:"Root cause analysis answers why, whether the problem is technical, procedural or interpretive. Categorizing risk, measuring performance and modelling uncertainty are not diagnosis."},
{id:"rd18",cat:"tool-purpose",type:"mc",stem:"A complete impact analysis of a proposed change assesses its effect on:",
 options:["Scope, schedule and cost together","Cost alone, using detailed cost analytics","The earned value indices for the current period","Critical path float alone"],
 key:"Scope, schedule and cost together",
 why:"Impact analysis is never single-dimension; a change moves all three baselines and approvers need all three figures. Earned value analysis measures performance already delivered against the baseline, so it cannot price a change that has not happened yet."},

/* ---------- first-response (4) ---------- */
{id:"rd19",cat:"first-response",type:"seq",stem:"Per PMP exam convention, order the four rungs of the standard first-response ladder, from first move to last resort.",
 options:["Gather information and assess the situation","Consult the relevant plan or artifact","Act within your authority, following the defined process","Escalate"],
 key:["Gather information and assess the situation","Consult the relevant plan or artifact","Act within your authority, following the defined process","Escalate"],
 why:"Assess, consult, act, escalate. Acting before consulting the plan skips the governing document, and escalation is the last rung rather than the opening move."},
{id:"rd20",cat:"first-response",type:"mc",stem:"Per PMP exam convention, when a stakeholder's role and information needs change, what is the FIRST step before the communications management plan is updated?",
 options:["Stakeholder analysis of the changed needs and influence","Submitting a change request to the change control board","Redistributing the existing reports to a wider list","Correcting the stakeholder register's contact details"],
 key:"Stakeholder analysis of the changed needs and influence",
 why:"Analysis produces the input; the plan update records its conclusion. Updating the artifact before the analysis that justifies it is the classic one-step-early trap. A change request may still be required to change a baselined plan, but it cannot be written before the analysis that justifies it."},
{id:"rd21",cat:"first-response",type:"mc",stem:"Per PMP exam convention, when a product owner is chronically unavailable, what precedes escalation?",
 options:["Assessing the capacity constraint and negotiating dedicated support directly","Replacing the product owner with a team proxy","Pausing the affected stories until availability improves","Logging the unavailability as an accepted risk"],
 key:"Assessing the capacity constraint and negotiating dedicated support directly",
 why:"Understand the constraint and offer a workable arrangement first; escalation is held back until direct engagement has failed. Engage before escalate."},
{id:"rd22",cat:"first-response",type:"mc",stem:"Escalation to senior management or a governance body is warranted when:",
 options:["The matter exceeds the project manager's authority or breaches a defined tolerance","The project manager's preferred solution is meeting resistance","A stakeholder is difficult to reach","The issue is technically complex"],
 key:"The matter exceeds the project manager's authority or breaches a defined tolerance",
 why:"Escalation has a defined trigger: an authority limit or a tolerance breach, not friction or difficulty. Same rule read forwards and backwards as the ladder's last rung."},
{id:"rd23",cat:"first-response",type:"mc",stem:"Per PMP exam convention, when a defined tolerance or threshold has been breached, the project manager:",
 options:["Escalates per the governance plan — the trigger converts engagement into escalation","Continues engaging the stakeholders informally until the matter resolves itself","Widens the tolerance to accommodate the deviation","Documents the breach and waits for the next status meeting"],
 key:"Escalates per the governance plan — the trigger converts engagement into escalation",
 why:"A breached tolerance is a defined trigger, not a judgement call — it converts ordinary engagement into a mandatory escalation under the governance plan. Hook: the threshold is the tripwire; once tripped, the PM does not renegotiate it."},
{id:"rd24",cat:"first-response",type:"mc",stem:"Per PMP exam convention, when a vendor violates an explicit contract clause, the response is to:",
 options:["Administer the contract — apply the remedy the clause defines","Schedule a relationship-building meeting before taking any action","Absorb the violation to preserve the vendor relationship","Renegotiate the entire contract from scratch"],
 key:"Administer the contract — apply the remedy the clause defines",
 why:"A contract violation is governed by the contract itself; Control Procurements applies the remedy the breached clause specifies rather than treating it as a relationship issue. Hook: a written clause beats an unwritten conversation."},
{id:"rd25",cat:"first-response",type:"mc",stem:"The first-response ladder ends in escalation. Escalation at the RIGHT time is:",
 options:["Correct and expected — after assessment, when authority or tolerance is exceeded","Always a sign that the project manager has failed","Appropriate only for budget-related issues","A last resort that should, in practice, never be used"],
 key:"Correct and expected — after assessment, when authority or tolerance is exceeded",
 why:"Escalation is a legitimate rung of the ladder, not an admission of failure — it is the correct move once assessment shows the matter is genuinely outside the PM's authority or tolerance. Hook: the last rung is still a rung, not a fall."},

/* ---------- money-rules, batch 2 — vendor & contract enforcement (4) ---------- */
{id:"rd26",cat:"money-rules",type:"mc",stem:"Per PMP exam convention, a seller that no longer holds a certification the contract requires is treated as:",
 options:["In breach of contract — the requirement is enforced, not temporarily waived","Compliant, provided the renewal application has been submitted","A risk to be logged and monitored until the certification is reissued","A quality matter for the seller's own quality department to resolve"],
 key:"In breach of contract — the requirement is enforced, not temporarily waived",
 why:"A contractual requirement binds regardless of schedule pressure, and letting work continue on an assumed renewal puts deliverable acceptance and the audit trail at risk. Hook: partial compliance is non-compliance."},
{id:"rd27",cat:"money-rules",type:"mc",stem:"Per PMP exam convention, what authorizes payment of a seller's invoice under an active contract?",
 options:["Verified performance — the work is inspected against the contract before payment is released","The seller's own progress report stating the work is complete","The sponsor's confidence in the vendor relationship","Elapsed time since the previous payment was made"],
 key:"Verified performance — the work is inspected against the contract before payment is released",
 why:"An invoice is a claim for money, not evidence that the work conforms; Control Procurements pays against inspected performance. Hook: the invoice never verifies itself."},
{id:"rd28",cat:"money-rules",type:"mc",stem:"In procurement, a claim is:",
 options:["A contested change on which buyer and seller cannot agree that compensation is due, or on how much","Any change request the seller submits","A defect found when inspecting the seller's work","An insurance policy bought to transfer a threat to a third party"],
 key:"A contested change on which buyer and seller cannot agree that compensation is due, or on how much",
 why:"Claims administration documents, processes and monitors contested changes, and unresolved claims move to the contract's dispute-resolution clause with negotiated settlement preferred. Hook: a claim is a disagreement about money, not a fault report."},
{id:"rd29",cat:"money-rules",type:"mc",stem:"Which process monitors contract performance, manages contract changes, and applies the remedies for nonperformance?",
 options:["Control Procurements","Conduct Procurements","Plan Procurement Management","Validate Scope"],
 key:"Control Procurements",
 why:"Plan chooses the strategy, Conduct awards the contract, Control administers it — enforcement of remedies included. Hook: administer the contract always lands in Control Procurements."},

/* ---------- governance, batch 2 — what a decision body receives (5) ---------- */
{id:"rd30",cat:"governance",type:"mc",stem:"Per PMP exam convention, a change request submitted to the change control board should carry:",
 options:["The rationale and a full impact analysis, leaving the decision to the board","A statement, agreed with the customer in advance, of who will pay for the change","The project manager's recommendation to reject any change that raises cost","A note that implementation has already started to protect the schedule"],
 key:"The rationale and a full impact analysis, leaving the decision to the board",
 why:"The submission supplies the information the board needs; the board decides the outcome, including who bears the cost. Hook: hand the body data and options, never a verdict."},
{id:"rd31",cat:"governance",type:"mc",stem:"Per PMP exam convention, while a change request is awaiting the board's decision, the project manager must NOT:",
 options:["Commit funds, promise the outcome to the customer, or begin implementing the change","Analyze the change's effect on scope, schedule and cost","Record the request and its status in the change log","Consult affected stakeholders to gather impact data"],
 key:"Commit funds, promise the outcome to the customer, or begin implementing the change",
 why:"Pre-committing strips the board of the authority the governance framework gives it, while analysis, logging and consultation are all legitimate preparation. Hook: prepare the decision, do not pre-empt it."},
{id:"rd32",cat:"governance",type:"mc",stem:"Per PMP exam convention, when a matter is escalated to a steering committee, the project manager brings:",
 options:["An assessment of the situation with viable options and their impacts","A decision already taken, for the committee to endorse","A commitment already given to the customer","A request that the committee gather the facts first"],
 key:"An assessment of the situation with viable options and their impacts",
 why:"Governance bodies own the decision; the project manager owns the analysis that makes the decision possible, and gathering the facts is never delegated upward. Hook: options up, decision down."},
{id:"rd33",cat:"governance",type:"mc",stem:"Per PMP exam convention, when local practice in a delivery country falls below the organization's ethical or compliance standard, the governance plan should:",
 options:["Define escalation procedures for the conflict while holding the corporate standard","Adjust the corporate standard to local practice for cultural alignment","Delegate ethics exceptions to local leadership","Substitute ethics training for the standard"],
 key:"Define escalation procedures for the conflict while holding the corporate standard",
 why:"Cultural sensitivity governs how you communicate, never where the ethical floor sits, and a defined escalation route is a core element of the governance plan. Hook: adapt the style, never the standard."},
{id:"rd34",cat:"governance",type:"mc",stem:"Per PMP exam convention, when a plan or framework is found to lack a mechanism — for example, no structured way to capture stakeholder input — the response is to:",
 options:["Request a change to the plan so the mechanism is built into it","Add more meetings to the schedule","Ask the PMO to monitor the gap","Record the gap in the risk register"],
 key:"Request a change to the plan so the mechanism is built into it",
 why:"A missing mechanism is a structural gap in a controlled artifact, so the fix amends the artifact and puts the new practice under governance; extra meetings add workload without closing anything. Hook: change the structure, not the meeting rhythm."},

/* ---------- tool-purpose, batch 2 — which instrument answers which question (4) ---------- */
{id:"rd35",cat:"tool-purpose",type:"mc",stem:"Per PMP exam convention, when candidate solutions to a problem already exist and stakeholders disagree on priorities, what comes before engaging them?",
 options:["An impact analysis of each candidate option","An emergency stakeholder meeting to choose collaboratively","Escalation to the sponsor for a ruling","A search of the lessons-learned repository"],
 key:"An impact analysis of each candidate option",
 why:"Stakeholders already in conflict need comparable data, and a forum convened without impact figures invites premature commitments. Hook: analyze the options, then convene."},
{id:"rd36",cat:"tool-purpose",type:"mc",stem:"Which analysis establishes whether a buyer may release a contracted vendor resource before the agreed end date?",
 options:["A review of the contract's terms and obligations","A stakeholder impact analysis","An earned value analysis of the vendor's work","A procurement audit of the vendor's past performance"],
 key:"A review of the contract's terms and obligations",
 why:"When the question is what a party is entitled to do, the governing document answers it; impact analysis can price a change but cannot say whether the change is permitted. Hook: obligation question — read the contract, then negotiate."},
{id:"rd37",cat:"tool-purpose",type:"mc",stem:"Per PMP exam convention, before return on investment can be calculated for a proposed change, the project must first:",
 options:["Define measurable benefits and the criteria for evaluating them","Calculate ROI and then infer the benefits from it","Review scope and objectives for organizational alignment","Collect customer feedback after delivery"],
 key:"Define measurable benefits and the criteria for evaluating them",
 why:"ROI is arithmetic performed on benefits, so it is premature until those benefits exist in measurable form with agreed evaluation criteria. Hook: define the benefit before you divide by it."},
{id:"rd38",cat:"tool-purpose",type:"mc",stem:"Per PMP exam convention, an analysis of why a project failed to meet its objectives is conducted in order to:",
 options:["Document findings so future projects benefit","Assign responsibility for the failure","Justify the resources already consumed","Build a case against the vendors involved"],
 key:"Document findings so future projects benefit",
 why:"Post-project analysis is a learning instrument feeding the lessons-learned repository, and PMI never keys blame allocation. Hook: the words assign responsibility inside an option are a disqualifier."},

/* ---------- first-response, batch 2 — enable, respond, and answer the item asked (4) ---------- */
{id:"rd39",cat:"first-response",type:"mc",stem:"Per PMP exam convention, when a team member's performance drops or they cannot get what they need from an existing artifact, the FIRST response is to:",
 options:["Support the individual — close the capability or understanding gap","Remind them that the current format or process was already agreed","Reassign the work to someone who can already do it","Escalate the shortfall to their functional manager"],
 key:"Support the individual — close the capability or understanding gap",
 why:"An unmet need is a capability gap, and defending the existing agreement leaves it unmet; support and coaching precede any citation of process. Hook: enable the person before you quote the rule."},
{id:"rd40",cat:"first-response",type:"mc",stem:"Per PMP exam convention, when a team resists a required step because they believe it adds no value, the project manager should:",

/* =====================================================================
   State + storage (guarded so file:// and private mode never crash)
   ===================================================================== */
const LS_KEY = "pmp-crunch-kit-v1";
const CATS = ["evm-calc","formulas","contract-types","conflict-modes","team-stages","risk-responses","change-control","agile-facts","artifacts","quality","estimating","adaptive-vocab","routing"];
const CAT_LABEL = {
  "evm-calc":"EVM calculations","formulas":"Formulas","contract-types":"Contract types","conflict-modes":"Conflict modes",
  "team-stages":"Team stages","risk-responses":"Risk responses","change-control":"Change control","agile-facts":"Agile facts",
  "artifacts":"Artifacts","quality":"Quality","estimating":"Estimating methods","adaptive-vocab":"Adaptive vocab","routing":"Routing & metrics"
};
let storageOK = true;

function defaultState(){
  return {v:1, cats:{}, items:{}, calib:{sureRight:0,sureWrong:0,unsureRight:0,unsureWrong:0}, tab:"drill"};
}
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return defaultState();
    const p = JSON.parse(raw);
    const d = defaultState();
    if(!p || typeof p !== "object") return d;
    d.cats = (p.cats && typeof p.cats === "object") ? p.cats : {};
    d.items = (p.items && typeof p.items === "object") ? p.items : {};
    if(p.calib && typeof p.calib === "object"){
      ["sureRight","sureWrong","unsureRight","unsureWrong"].forEach(function(k){
        d.calib[k] = typeof p.calib[k] === "number" ? p.calib[k] : 0;
      });
    }
    if(p.tab === "drill" || p.tab === "review" || p.tab === "progress") d.tab = p.tab;
    return d;
  }catch(e){
    storageOK = false;
    return defaultState();
  }
}
function saveState(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ storageOK = false; }
}
let state = loadState();
try{ if(typeof localStorage === "undefined") storageOK = false; }catch(e){ storageOK = false; }

/* =====================================================================
   Helpers
   ===================================================================== */
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];
  });
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function fmtNum(n){
  if(typeof n !== "number" || !isFinite(n)) return String(n);
  if(Math.abs(n) >= 1000) return n.toLocaleString("en-US");
  return String(n);
}
function parseNum(raw){
  if(raw == null) return NaN;
  const cleaned = String(raw).replace(/[,\s $£€%]/g, "").replace(/−/g, "-");
  if(cleaned === "" || cleaned === "-" ) return NaN;
  if(!/^-?\d*\.?\d+$/.test(cleaned)) return NaN;
  return parseFloat(cleaned);
}
function pct(c, a){ return a > 0 ? Math.round((c/a)*100) : 0; }
function catStat(cat){ const s = state.cats[cat]; return {a:(s&&s.a)||0, c:(s&&s.c)||0}; }
function totals(){
  let a=0,c=0;
  CATS.forEach(function(k){ const s=catStat(k); a+=s.a; c+=s.c; });
  return {a:a, c:c};
}
const BY_ID = {};
ITEM_BANK.forEach(function(it){ BY_ID[it.id] = it; });
REVIEW_DECK.forEach(function(it){ BY_ID[it.id] = it; });

/* Bank integrity check — warns in console, never throws. */
(function auditBank(){
  const seen = {};
  ITEM_BANK.concat(REVIEW_DECK).forEach(function(it){
    if(seen[it.id]) console.warn("Duplicate item id:", it.id);
    seen[it.id] = true;
    if(it.type === "mc"){
      if(!Array.isArray(it.options) || it.options.indexOf(it.key) === -1) console.warn("MC key not in options:", it.id);
    }else if(it.type === "num"){
      if(typeof it.key !== "number") console.warn("NUM key not a number:", it.id);
    }else if(it.type === "seq"){
      if(!Array.isArray(it.options) || !Array.isArray(it.key) || it.options.length !== it.key.length) console.warn("SEQ length mismatch:", it.id);
      else it.key.forEach(function(k){ if(it.options.indexOf(k) === -1) console.warn("SEQ key member missing from options:", it.id, k); });
    }else{
      console.warn("Unknown type:", it.id, it.type);
    }
  });
})();

/* =====================================================================
   Session engine
   ===================================================================== */
let session = null;

function buildQueue(bank, n){
  const scored = bank.map(function(it){
    const cs = catStat(it.cat);
    let w;
    if(cs.a < 3){ w = 1.6; }                       // unseen categories get a mild boost
    else { w = 0.6 + 2.4 * (1 - cs.c/cs.a); }      // low accuracy -> heavier weight
    const is = state.items[it.id];
    if(is && is.a > 0){ w *= (0.7 + 1.3 * (1 - is.c/is.a)); }  // previously missed items favoured
    if(w < 0.05) w = 0.05;
    return {it:it, k: Math.pow(Math.random(), 1/w)};   // weighted sampling without replacement
  });
  scored.sort(function(a,b){ return b.k - a.k; });
  return scored.slice(0, Math.min(n, scored.length)).map(function(x){ return x.it; });
}

function startSession(source, len){
  const bank = source === "review" ? REVIEW_DECK : ITEM_BANK;
  if(!bank.length) return;
  const n = (len === "all" || len > bank.length) ? bank.length : len;
  session = {
    source: source,
    queue: buildQueue(bank, n),
    idx: 0,
    planned: n,
    inSweep: false,
    sweepIds: [],
    rq: {},
    done: false,
    log: [],
    conf: null,
    phase: "ask",
    cur: null,
    curOpts: null,
    picked: [],
    lastCorrect: null,
    lastAnswer: ""
  };
  prepareCurrent();
  render();
}

function prepareCurrent(){
  if(!session || session.done) return;
  const it = session.queue[session.idx];
  session.cur = it;
  session.conf = null;
  session.phase = "ask";
  session.picked = [];
  session.lastCorrect = null;
  session.lastAnswer = "";
  session.curOpts = (it && (it.type === "mc" || it.type === "seq")) ? shuffle(it.options) : null;
}

function recordResult(item, correct){
  const cs = state.cats[item.cat] || (state.cats[item.cat] = {a:0,c:0});
  cs.a += 1; if(correct) cs.c += 1;
  const is = state.items[item.id] || (state.items[item.id] = {a:0,c:0});
  is.a += 1; if(correct) is.c += 1;
  if(session.conf === "sure"){ if(correct) state.calib.sureRight++; else state.calib.sureWrong++; }
  else if(session.conf === "unsure"){ if(correct) state.calib.unsureRight++; else state.calib.unsureWrong++; }
  session.log.push({id:item.id, correct:correct, conf:session.conf});
  saveState();
}

function grade(answerDisplay, correct){
  const item = session.cur;
  session.lastCorrect = correct;
  session.lastAnswer = answerDisplay;
  session.phase = "feedback";
  recordResult(item, correct);
  if(!correct){
    if(session.sweepIds.indexOf(item.id) === -1 && !session.inSweep) session.sweepIds.push(item.id);
    const used = session.rq[item.id] || 0;
    if(used < 2){
      session.rq[item.id] = used + 1;
      const offset = 3 + Math.floor(Math.random()*4);            // 3-6 positions later
      const pos = Math.min(session.queue.length, session.idx + offset);
      session.queue.splice(pos, 0, item);
    }
  }
  render();
}

function advance(){
  session.idx += 1;
  if(session.idx >= session.queue.length){
    const sweep = session.sweepIds.map(function(id){ return BY_ID[id]; }).filter(Boolean);
    if(!session.inSweep && sweep.length){
      session.inSweep = true;
      session.queue = shuffle(sweep);
      session.sweepIds = [];
      session.idx = 0;
      session.rq = {};
    }else{
      session.done = true;
    }
  }
  prepareCurrent();
  render();
}

function sessionScore(){
  let a=0,c=0;
  session.log.forEach(function(r){ a++; if(r.correct) c++; });
  return {a:a, c:c};
}

/* =====================================================================
   Render
   ===================================================================== */
const view = document.getElementById("view");
const tabsEl = document.getElementById("tabs");

function renderHeader(){
  const t = totals();
  document.getElementById("hdrStat").textContent = t.a > 0 ? (pct(t.c,t.a) + "%  ·  " + t.c + "/" + t.a) : "no data yet";
  const strip = document.getElementById("strip");
  const L = document.getElementById("stripL");
  const R = document.getElementById("stripR");

  if(session && !session.done){
    const s = sessionScore();
    const total = session.queue.length;
    const goodW = (s.c/total)*100;
    const badW = ((s.a-s.c)/total)*100;
    strip.innerHTML = '<i class="s-good" style="width:'+goodW.toFixed(2)+'%"></i>'
                    + '<i class="s-bad" style="width:'+badW.toFixed(2)+'%"></i>'
                    + '<i class="s-todo" style="width:'+Math.max(0,100-goodW-badW).toFixed(2)+'%"></i>';
    L.textContent = (session.inSweep ? "review sweep " : "session ") + (session.idx+1) + " / " + total;
    R.textContent = s.a ? (pct(s.c,s.a) + "% this session") : "";
  }else{
    const overall = t.a > 0 ? pct(t.c,t.a) : 0;
    strip.innerHTML = '<i class="s-good" style="width:'+overall+'%"></i><i class="s-todo" style="width:'+(100-overall)+'%"></i>';
    L.textContent = t.a > 0 ? "lifetime accuracy" : "ready";
    R.textContent = ITEM_BANK.length + " items in bank";
  }
}

function render(){
  renderHeader();
  Array.prototype.forEach.call(tabsEl.querySelectorAll("button"), function(b){
    b.setAttribute("aria-selected", b.dataset.tab === state.tab ? "true" : "false");
  });
  if(state.tab === "drill") renderDrill();
  else if(state.tab === "review") renderReview();
  else renderProgress();
}

function storageWarn(){
  return storageOK ? "" : '<div class="warnbar">Local storage is unavailable, so progress will not persist after you close this tab. Everything else works.</div>';
}

function renderDrill(){
  if(!session || session.source !== "drill"){
    view.innerHTML = storageWarn() +
      '<div class="card">' +
      '<h2 class="sec">Facts drill</h2>' +
      '<p class="lede">' + ITEM_BANK.length + ' one-right-answer items across ' + CATS.length + ' categories. The queue is weighted toward your weakest categories. Miss one and it comes back a few questions later, then again in a review sweep at the end.</p>' +
      '<div class="btnrow">' +
      '<button class="btn primary" data-start="20">20 items</button>' +
      '<button class="btn primary" data-start="40">40 items</button>' +
      '<button class="btn" data-start="all">Full bank</button>' +
      '</div></div>' + weakSpotCard();
    Array.prototype.forEach.call(view.querySelectorAll("[data-start]"), function(b){
      b.addEventListener("click", function(){
        const v = b.dataset.start;
        startSession("drill", v === "all" ? "all" : parseInt(v,10));
      });
    });
    return;
  }
  if(session.done){ renderDone(); return; }
  view.innerHTML = questionHTML() + (session.phase === "feedback" ? feedbackHTML() : "");
  wireQuestion();
}

function weakSpotCard(){
  const rows = CATS.map(function(k){ return {k:k, s:catStat(k)}; }).filter(function(r){ return r.s.a >= 3; });
  if(!rows.length) return "";
  rows.sort(function(a,b){ return (a.s.c/a.s.a) - (b.s.c/b.s.a); });
  const worst = rows.slice(0,3);
  return '<div class="card"><h2 class="sec">Current weak spots</h2>' +
    worst.map(function(r){
      return '<div class="kv"><span class="k">' + esc(CAT_LABEL[r.k]) + '</span><span class="v">' + pct(r.s.c,r.s.a) + '%</span></div>';
    }).join("") +
    '<p class="hint" style="margin-top:0.5rem;margin-bottom:0">These get drawn more often in the next session.</p></div>';
}

function questionHTML(){
  const it = session.cur;
  const locked = session.phase === "feedback";
  let body = "";

  if(it.type === "mc"){
    const letters = ["A","B","C","D","E","F"];
    body = '<div class="opts">' + session.curOpts.map(function(o,i){
      let cls = "opt";
      let tag = "";
      if(locked){
        if(o === it.key){ cls += " is-key"; tag = '<span class="tagr">Correct</span>'; }
        else if(o === session.lastAnswer){ cls += " is-wrong"; tag = '<span class="tagr">You</span>'; }
        else cls += " dim";
      }
      return '<button class="' + cls + '" data-opt="' + esc(o) + '"' + (locked ? " disabled" : "") + '>' +
             '<span class="k">' + letters[i] + '</span><span>' + esc(o) + '</span>' + tag + '</button>';
    }).join("") + '</div>';

  }else if(it.type === "num"){
    body = '<div class="numrow">' +
      '<input class="numin" id="numin" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="answer" ' +
      (locked ? 'disabled value="' + esc(session.lastAnswer) + '"' : "") + '>' +
      '<button class="btn primary" id="numCheck"' + (locked ? " disabled" : "") + '>Check</button></div>' +
      '<p class="hint" style="margin:0.45rem 0 0">Graded to ±0.01. Commas and currency symbols are ignored.</p>';

  }else{ // seq
    const remaining = session.curOpts.filter(function(o){ return session.picked.indexOf(o) === -1; });
    const pickedHTML = session.picked.length
      ? session.picked.map(function(o,i){ return '<div class="seqpick"><b>' + (i+1) + '.</b><span>' + esc(o) + '</span></div>'; }).join("")
      : '<span class="empty">Tap the options below in the correct order.</span>';
    body = '<div class="seqbox">' + pickedHTML + '</div>';
    if(!locked){
      body += '<div class="opts">' + remaining.map(function(o){
        return '<button class="opt" data-seq="' + esc(o) + '"><span class="k">+</span><span>' + esc(o) + '</span></button>';
      }).join("") + '</div>';
      body += '<div class="btnrow">' +
        '<button class="btn" id="seqUndo"' + (session.picked.length ? "" : " disabled") + '>Undo</button>' +
        '<button class="btn primary" id="seqCheck"' + (session.picked.length === session.curOpts.length ? "" : " disabled") + '>Check order</button>' +
        '</div>';
    }
  }

  const confHTML = locked ? "" :
    '<div class="conf"><span class="lab">Confidence</span>' +
    '<button data-conf="sure" aria-pressed="' + (session.conf === "sure") + '">Sure</button>' +
    '<button data-conf="unsure" aria-pressed="' + (session.conf === "unsure") + '">Unsure</button>' +
    '<span class="hint" style="margin:0">optional</span></div>';

  const typeLabel = it.type === "mc" ? "Multiple choice" : (it.type === "num" ? "Numeric" : "Order the steps");

  return storageWarn() + '<div class="card">' +
    '<div class="meta"><span class="chip cat">' + esc(CAT_LABEL[it.cat] || it.cat) + '</span>' +
    '<span class="chip">' + typeLabel + '</span>' +
    (session.inSweep ? '<span class="chip sweep">Review sweep</span>' : "") +
    ((state.items[it.id] && state.items[it.id].a > 0 && session.phase === "ask") ? '<span class="chip">Seen ' + state.items[it.id].a + 'x</span>' : "") +
    '</div>' +
    '<p class="stem">' + esc(it.stem) + '</p>' +
    confHTML + body + '</div>';
}

function feedbackHTML(){
  const it = session.cur;
  const ok = session.lastCorrect;
  let keyText;
  if(it.type === "num") keyText = fmtNum(it.key);
  else if(it.type === "seq") keyText = it.key.join("  →  ");
  else keyText = it.key;

  let calibNote = "";
  if(session.conf === "sure" && !ok) calibNote = 'You marked this SURE and missed it. That is the dangerous kind of gap — it will not feel wrong on exam day.';
  else if(session.conf === "unsure" && ok) calibNote = 'You marked this UNSURE and got it right. Knowledge is there; trust it and stop second-guessing.';

  return '<div class="fb ' + (ok ? "good" : "bad") + '">' +
    '<div class="verdict">' + (ok ? "Correct" : "Not quite") + '</div>' +
    '<div class="keyline">Key: <em>' + esc(keyText) + '</em></div>' +
    '<div class="why">' + esc(it.why) + '</div>' +
    (calibNote ? '<div class="calib">' + esc(calibNote) + '</div>' : "") +
    '<div class="btnrow"><button class="btn primary wide" id="nextBtn">Next →</button></div>' +
    '</div>';
}

function wireQuestion(){
  const it = session.cur;

  Array.prototype.forEach.call(view.querySelectorAll("[data-conf]"), function(b){
    b.addEventListener("click", function(){
      session.conf = (session.conf === b.dataset.conf) ? null : b.dataset.conf;
      render();
    });
  });

  if(session.phase === "feedback"){
    const nb = document.getElementById("nextBtn");
    if(nb){ nb.addEventListener("click", advance); nb.focus(); }
    return;
  }

  if(it.type === "mc"){
    Array.prototype.forEach.call(view.querySelectorAll("[data-opt]"), function(b){
      b.addEventListener("click", function(){
        const val = b.dataset.opt;
        grade(val, val === it.key);
      });
    });
  }else if(it.type === "num"){
    const input = document.getElementById("numin");
    const btn = document.getElementById("numCheck");
    function submitNum(){
      const raw = input.value;
      const val = parseNum(raw);
      if(isNaN(val)){ input.focus(); return; }
      grade(raw.trim(), Math.abs(val - it.key) <= 0.01 + 1e-9);
    }
    btn.addEventListener("click", submitNum);
    input.addEventListener("keydown", function(e){
      if(e.key === "Enter"){
        e.preventDefault();
        e.stopPropagation();   // otherwise the same Enter bubbles up and skips the feedback
        submitNum();
      }
    });
    input.focus();
  }else{
    Array.prototype.forEach.call(view.querySelectorAll("[data-seq]"), function(b){
      b.addEventListener("click", function(){
        session.picked.push(b.dataset.seq);
        render();
      });
    });
    const undo = document.getElementById("seqUndo");
    if(undo) undo.addEventListener("click", function(){ session.picked.pop(); render(); });
    const chk = document.getElementById("seqCheck");
    if(chk) chk.addEventListener("click", function(){
      const ok = session.picked.length === it.key.length && session.picked.every(function(v,i){ return v === it.key[i]; });
      grade(session.picked.join("  →  "), ok);
    });
  }
}

function renderDone(){
  const s = sessionScore();
  const cal = session.log.reduce(function(acc,r){
    if(r.conf === "sure" && !r.correct) acc.sw++;
    if(r.conf === "unsure" && r.correct) acc.ur++;
    return acc;
  }, {sw:0, ur:0});
  const missed = {};
  session.log.forEach(function(r){ if(!r.correct){ const it = BY_ID[r.id]; if(it) missed[it.cat] = (missed[it.cat]||0)+1; } });
  const missedRows = Object.keys(missed).sort(function(a,b){ return missed[b]-missed[a]; }).map(function(k){
    return '<div class="kv"><span class="k">' + esc(CAT_LABEL[k]||k) + '</span><span class="v">' + missed[k] + ' missed</span></div>';
  }).join("");

  view.innerHTML = '<div class="card">' +
    '<h2 class="sec">Session complete</h2>' +
    '<div class="bigstat">' +
      '<div><div class="v">' + pct(s.c,s.a) + '%</div><div class="l">accuracy</div></div>' +
      '<div><div class="v">' + s.c + '/' + s.a + '</div><div class="l">answers</div></div>' +
      '<div><div class="v">' + cal.sw + '</div><div class="l">sure &amp; wrong</div></div>' +
    '</div>' +
    (missedRows ? '<h2 class="sec" style="margin-top:0.5rem">Where you leaked points</h2>' + missedRows : '<p class="lede">Clean sweep — nothing missed.</p>') +
    (cal.ur ? '<div class="verdictline">' + cal.ur + ' item(s) you called unsure and got right. You know more than you think.</div>' : "") +
    '<div class="btnrow">' +
      '<button class="btn primary" id="again">Drill again</button>' +
      '<button class="btn" id="toProgress">See progress</button>' +
    '</div></div>';
  document.getElementById("again").addEventListener("click", function(){ session = null; render(); });
  document.getElementById("toProgress").addEventListener("click", function(){ state.tab = "progress"; saveState(); render(); });
}

function renderReview(){
  if(!REVIEW_DECK.length){
    view.innerHTML = storageWarn() + '<div class="card"><div class="empty-state">' +
      '<b>Deck empty — will fill after your calibration</b>' +
      'Your missed items from official practice go here. Same schema as the main bank, drilled with the same engine.' +
      '</div></div>';
    return;
  }
  if(!session || session.source !== "review"){
    view.innerHTML = storageWarn() + '<div class="card">' +
      '<h2 class="sec">Review deck</h2>' +
      '<p class="lede">' + REVIEW_DECK.length + ' item(s) from your missed official-practice questions.</p>' +
      '<div class="btnrow"><button class="btn primary wide" id="startReview">Drill the deck</button></div></div>';
    document.getElementById("startReview").addEventListener("click", function(){ startSession("review","all"); });
    return;
  }
  if(session.done){ renderDone(); return; }
  view.innerHTML = questionHTML() + (session.phase === "feedback" ? feedbackHTML() : "");
  wireQuestion();
}

function renderProgress(){
  const t = totals();
  const c = state.calib;
  const sureTotal = c.sureRight + c.sureWrong;
  const unsureTotal = c.unsureRight + c.unsureWrong;

  let verdict;
  if(sureTotal + unsureTotal < 5){
    verdict = "Tap Sure / Unsure on a few more items to get a calibration read.";
  }else{
    const sureAcc = sureTotal ? c.sureRight/sureTotal : null;
    const unsureAcc = unsureTotal ? c.unsureRight/unsureTotal : null;
    if(sureAcc !== null && sureAcc < 0.85 && c.sureWrong >= 2){
      verdict = "Overconfident: you missed " + c.sureWrong + " item(s) you called Sure (" + Math.round(sureAcc*100) + "% accuracy when sure). Slow down on the categories below.";
    }else if(unsureAcc !== null && unsureAcc > 0.7 && c.unsureRight >= 3){
      verdict = "Underconfident: " + c.unsureRight + " of " + unsureTotal + " items you called Unsure were right (" + Math.round(unsureAcc*100) + "%). Your gut is better than your self-assessment.";
    }else{
      verdict = "Well calibrated: Sure " + (sureTotal ? Math.round(sureAcc*100) : 0) + "% vs Unsure " + (unsureTotal ? Math.round(unsureAcc*100) : 0) + "%. Keep trusting the split.";
    }
  }

  const bars = CATS.map(function(k){
    const s = catStat(k);
    const p = pct(s.c, s.a);
    const col = s.a === 0 ? "var(--surface-3)" : (p >= 80 ? "var(--good)" : (p >= 60 ? "var(--warn)" : "var(--bad)"));
    const bankCount = ITEM_BANK.filter(function(i){ return i.cat === k; }).length;
    return '<div class="catrow"><div class="top">' +
      '<span class="nm">' + esc(CAT_LABEL[k]) + ' <span class="pill">' + bankCount + '</span></span>' +
      '<span class="fr">' + (s.a ? s.c + "/" + s.a + "  ·  " + p + "%" : "not attempted") + '</span>' +
      '</div><div class="track"><i style="width:' + (s.a ? p : 0) + '%;background:' + col + '"></i></div></div>';
  }).join("");

  view.innerHTML = storageWarn() +
    '<div class="bigstat">' +
      '<div><div class="v">' + (t.a ? pct(t.c,t.a) : 0) + '%</div><div class="l">overall</div></div>' +
      '<div><div class="v">' + t.a + '</div><div class="l">attempted</div></div>' +
      '<div><div class="v">' + t.c + '</div><div class="l">correct</div></div>' +
    '</div>' +
    '<div class="card"><h2 class="sec">Accuracy by category</h2>' + bars + '</div>' +
    '<div class="card"><h2 class="sec">Calibration</h2>' +
      '<div class="kv"><span class="k">Sure and right</span><span class="v">' + c.sureRight + '</span></div>' +
      '<div class="kv"><span class="k">Sure and wrong (overconfidence)</span><span class="v">' + c.sureWrong + '</span></div>' +
      '<div class="kv"><span class="k">Unsure and right (underconfidence)</span><span class="v">' + c.unsureRight + '</span></div>' +
      '<div class="kv"><span class="k">Unsure and wrong</span><span class="v">' + c.unsureWrong + '</span></div>' +
      '<div class="verdictline">' + esc(verdict) + '</div>' +
    '</div>' +
    '<div class="card"><h2 class="sec">Reset</h2>' +
      '<p class="lede">Clears every attempt, category stat and calibration count on this device.</p>' +
      '<button class="btn danger wide" id="resetBtn">Reset all progress</button></div>';

  document.getElementById("resetBtn").addEventListener("click", function(){
    let ok = false;
    try{ ok = window.confirm("Reset all progress? This cannot be undone."); }catch(e){ ok = false; }
    if(!ok) return;
    state = defaultState();
    state.tab = "progress";
    session = null;
    try{ localStorage.removeItem(LS_KEY); }catch(e){ /* ignore */ }
    saveState();
    render();
  });
}

/* =====================================================================
   Wiring
   ===================================================================== */
Array.prototype.forEach.call(tabsEl.querySelectorAll("button"), function(b){
  b.addEventListener("click", function(){
    state.tab = b.dataset.tab;
    saveState();
    render();
  });
});

document.addEventListener("keydown", function(e){
  if(state.tab === "progress") return;
  if(!session || session.done || !session.cur) return;
  const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
  if(tag === "input") return;   // never let a keypress inside the answer field drive the queue
  if(session.phase === "feedback"){
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); advance(); }
    return;
  }
  if(session.cur.type === "mc" && /^[1-6]$/.test(e.key)){
    const i = parseInt(e.key,10) - 1;
    if(i < session.curOpts.length){
      e.preventDefault();
      const val = session.curOpts[i];
      grade(val, val === session.cur.key);
    }
  }
});

render();
</script>
